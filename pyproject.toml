[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "indic-codemix-tokenizer-lab"
version = "0.1.0"
description = "Reproducible tokenizer adaptation experiments for Indic code-mixed text"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "sentencepiece>=0.2.0,<0.3",
  "numpy>=1.24,<3",
  "scikit-learn>=1.3,<2",
  "scipy>=1.10,<2",
  "matplotlib>=3.7,<4",
  "indic-transliteration>=2.3,<3",
  "morfessor>=2.0,<3",
  "torch>=2.1,<3",
  "transformers>=4.40,<5",
  "sacrebleu>=2.4,<3",
  "tokenizers>=0.19,<1",
  "peft>=0.12,<1",
  "joblib>=1.3,<2",
]

[project.scripts]
indic-tokenizer-lab = "indic_tokenizer_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
